## Synthetic population pipeline for Île-de-France
## based on the synpp package

# This is the path to a directory where the pipeline can store temporary data
working_directory: /work/home/simulations/matsim/cache

# This section defines which parts of the pipeline should be run
run:
  - synthesis.output # To create the output population in the output_path (see below)
  #- matsim.output # Uncomment, if you want to run the full simulation (you'll need Java for that)
  #- matsim.scenario.supply.gtfs

# Here the configuraiton of the pipeline starts
config:
  # Some general configuration
  processes: 64

  # Define whether to use ENTD or EGT as the household travel survey (HTS)
  hts: mobisurvstd
  mobisurvstd.path: /work/home/simulations/matsim/data/emc2/2021 - Saint Etienne/lil-1634.csv
  hts_shp_name: EMC2_StEtienne_2022_DTIRB.shp
  filter_hts: False # Quit trips performed outside the HTS area

  activity_purposes: ["leisure", "shop", "escort", "task"]

  # Define sampling rate and random seed for the output population
  sampling_rate: 1
  random_seed: 1234

  # Paths to the input data and where the output should be stored
  data_path:  /work/home/simulations/matsim/data
  output_path: /work/home/simulations/matsim/national/output_100p/2021_saintetienne

  # Only interesting if you run the simulation
  java_memory: 128G

  # Activate if you want to run mode choice
  mode_choice: false

  # Uncomment to use the bhepop2 package for attributing income
  #income_assignation_method: bhepop2

  # IdF settings
  output_prefix: saintetienne_
  # gpkg format not adapted for 100% french demand
  output_formats: ["csv", "parquet", "geoparquet"]
  regions: []
  #gtfs_path: gtfs_idf
  #osm_path: osm_idf
  #ban_path: ban_idf
  ban_path: ban_national
  #bdtopo_path: bdtopo_idf
  #bdtopo_path: bdtopo_dep08_2025
  #bdtopo_path: bdtopo_national
  bdtopo_path: bdtopo_national_reg/84

  #iris_path: iris_2023

  java_binary: /work/home/install/jdk-25.0.2/bin/java
  osmosis_binary: /work/home/install/osmosis.0.48/osmosis
  maven_binary: /work/home/install/apache-maven-3.8.4/bin/mvn
  eqasim_path: /work/home/install/ile_de_france-2.1.0.jar
  #eqasim_tag: None
  eqasim_version: 2.1.0
  pt2matsim_path: /work/home/install/pt2matsim-26.1.1-SNAPSHOT-shaded.jar

  export_detailed_network: True
  secondary_activities.maximum_iterations: 100

  #exclude_no_employee: true

  #home_location_source: tiles

  #education_location_source: weighted
  #education_location_source: addresses
  #education_file: education/education_addresses.geojson
